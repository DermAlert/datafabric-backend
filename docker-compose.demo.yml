services:
  dermalert-backend:
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      SPARK_MODE: cluster
      SPARK_MASTER: spark://spark-master:7077
      SPARK_MASTER_WEBUI_PORT: "8082"
      SPARK_DRIVER_HOST: dermalert-backend
      BRONZE_BUCKET: datafabric-bronze
      SILVER_BUCKET: datafabric-silver
      INTERNAL_METASTORE_BUCKET: datafabric-metastore

  mysql-ida:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ida
      MYSQL_USER: dermalert_dev
      MYSQL_PASSWORD: dermalert_dev
      MYSQL_ROOT_PASSWORD: dermalert_root_dev
    ports:
      - "3307:3306"
    volumes:
      - ida_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shared-network

  postgres-cmpd:
    image: postgres:18.1
    environment:
      POSTGRES_DB: cmpd
      POSTGRES_USER: dermalert_dev
      POSTGRES_PASSWORD: dermalert_dev
    ports:
      - "5435:5432"
    volumes:
      - cmpd_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermalert_dev -d cmpd"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shared-network

volumes:
  ida_mysql_data:
  cmpd_postgres_data:
