coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://trino:8080

catalog.management=dynamic
# TODO: recriar os catálogos quando o Trino sobe (talvez o "ensure_catalog_exists_async()" seja suficiente)
catalog.store=memory

# --- memória + Fault-Tolerant Execution (FTE) ---
# Spill legado de join está inerte no Trino 481 (validado empiricamente:
# INNER/FULL OUTER estouram o cap sem derramar, mesmo com force_spilling_join).
# FTE é o substituto oficial: estágios de join rodam particionados em tasks
# pequenas com dados intermediários spooled em disco (exchange-manager.properties).
query.max-memory-per-node=384MB
query.max-memory=512MB
join-distribution-type=PARTITIONED
retry-policy=TASK
