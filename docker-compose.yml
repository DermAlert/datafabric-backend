  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
      - MINIO_SERVER_URL=http://localhost:9000
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    volumes:
      - ./data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - shared-network

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minio minio123
        mc mb --ignore-existing local/datafabric-bronze
        mc mb --ignore-existing local/datafabric-silver
        mc mb --ignore-existing local/datafabric-metastore
    networks:
      - shared-network

  postgres-airflow:
    image: postgres:18.1
    ports: 
      - 5433:5432
    # Airflow clients: scheduler(1) + webserver(1) + workers(≤3) + headroom = ~20
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c jit=off
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dermalert_airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres"]
     interval: 10s
     timeout: 5s
     retries: 5
    networks:
      - shared-network

  postgres-backend:
    image: postgres:18.1
    ports: 
      - 5434:5432
    # Connection budget:
    #   FastAPI pool  : pool_size(30) + max_overflow(70) = 100
    #   Airflow       : ~20
    #   Trino JDBC    : ~10
    #   tools / admin : ~5
    #   safety buffer : 15
    #   TOTAL         : ~150  →  max_connections=200
    command: >
      postgres
      -c max_connections=200
      -c io_method=worker
      -c io_workers=4
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c jit=off
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dermalert_backend
    volumes:
      - backend_pgdata:/var/lib/postgresql
      # PostgreSQL executes these files only when the named volume is empty.
      # The snapshot contains an anonymized, reusable development database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres"]
     interval: 10s
     timeout: 5s
     retries: 5
    networks:
      - shared-network

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - shared-network

  # ==========================================================================
  # Hive Metastore - Central metadata repository for all catalogs
