x-airflow-common:
  &airflow-common
  # Keep using the standard Airflow image
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5}
  # build: 
  #   context: .
  #   dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-airflow/dermalert_airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://postgres:postgres@postgres-airflow/dermalert_airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    # Chave fixa compartilhada entre webserver e worker para que os tokens JWT
    # de log-serving sejam válidos em ambos os containers. Sem isso cada
    # container gera uma chave aleatória no boot → InvalidSignatureError.
    AIRFLOW__WEBSERVER__SECRET_KEY: '7aa10963cfba2b3a1bdc0d50f0963ce4f8b1dcfd952c7245294a7c6314c083a7'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Scheduler tuning: reduz reprocessamento contínuo de DAGs
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '30'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '300'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '2'
    AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_CREATE_PER_LOOP: '5'
    AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY: '16'
    # Triggerer: limita capacidade (padrão é 1000, excessivo em dev)
    AIRFLOW__TRIGGERER__DEFAULT_CAPACITY: '100'
    # Reduz verbosidade de log
    AIRFLOW__LOGGING__LOGGING_LEVEL: 'WARNING'
    AWS_REGION: us-east-1
    AWS_S3_ALLOW_UNSAFE_RENAME: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-minio deltalake==1.4.2 beautifulsoup4 openpyxl}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy
  extra_hosts:
    - "localhost:host-gateway"
  networks:
      - shared-network

services:
  dermalert-backend:
    build: ./project
    command: >
      bash -c "poetry run alembic upgrade head &&
      poetry run uvicorn app.main:app --workers 1 --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Complete local defaults make a fresh checkout boot without creating an
      # .env file. Values from an existing .env or shell still take precedence.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres-backend:5432/dermalert_backend}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      TRINO_HOST: ${TRINO_HOST:-trino}
      TRINO_PORT: ${TRINO_PORT:-8080}
      TRINO_USER: ${TRINO_USER:-admin}
      SPARK_MODE: ${SPARK_MODE:-standalone}
      SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-50}
      SPARK_LOG_LEVEL: ${SPARK_LOG_LEVEL:-WARN}
      AIRFLOW_API_URL: ${AIRFLOW_API_URL:-http://airflow-webserver:8080}
      AIRFLOW_API_USER: ${AIRFLOW_API_USER:-airflow}
      AIRFLOW_API_PASS: ${AIRFLOW_API_PASS:-airflow}
      INTERNAL_METASTORE_BUCKET: ${INTERNAL_METASTORE_BUCKET:-datafabric-metastore}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-datafabric-bronze}
      BRONZE_CATALOG: ${BRONZE_CATALOG:-bronze}
      BRONZE_SCHEMA: ${BRONZE_SCHEMA:-default}
      SILVER_BUCKET: ${SILVER_BUCKET:-datafabric-silver}
      SILVER_CATALOG: ${SILVER_CATALOG:-silver}
      SILVER_SCHEMA: ${SILVER_SCHEMA:-default}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-datafabric-local-dev-encryption-key-v1}
      # Development-safe defaults: the previous 4 GB driver + 6 GB worker,
      # combined with Trino and Airflow, exhausted a 16 GB Docker VM at boot.
      # COMPOSE_* variables still allow larger machines to opt in explicitly.
      SPARK_DRIVER_MEMORY: ${COMPOSE_SPARK_DRIVER_MEMORY:-768m}
      SPARK_EXECUTOR_MEMORY: ${COMPOSE_SPARK_EXECUTOR_MEMORY:-768m}
      SPARK_POOL_SIZE: ${COMPOSE_SPARK_POOL_SIZE:-1}
      THREAD_POOL_SIZE: ${COMPOSE_THREAD_POOL_SIZE:-10}
    volumes:
      - ./project:/usr/src/app
      # Persist Ivy/Maven JAR cache so Spark dependencies (delta-spark,
      # hadoop-aws, trino-jdbc) are not re-downloaded on every container restart.
      - spark_ivy_cache:/tmp/.ivy2
    ports:
      - 8004:8000
      # Spark driver RPC + BlockManager ports — executors connect back to these.
      # Fixed ports (not random) so docker-compose can expose them to the shared network.
      - "7078:7078"   # spark.driver.port
      - "7079:7079"   # spark.blockManager.port
      - "4040:4040"   # Spark UI
    depends_on:
      postgres-backend:
        condition: service_healthy
      cmpd-postgres:
        condition: service_healthy
      ida-mysql:
        condition: service_healthy
      reh-postgres:
        condition: service_healthy
      cdi-postgres:
        condition: service_healthy
      rfa-mysql:
        condition: service_healthy
      dermexp_ham_postgres:
        condition: service_healthy
      dermexp_hiba_postgres:
        condition: service_healthy
      dermexp_pad_mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      trino:
        condition: service_started
      spark-master:
        condition: service_healthy
      spark-ivy-init:
        condition: service_completed_successfully
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - shared-network

  # --------------------------------------------------------------------------
  # Reusable source databases. Their service names match the hosts stored in
  # the bundled DataFabric snapshot, so no registration step is required.
  # --------------------------------------------------------------------------
  cmpd-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cmpd_user
      POSTGRES_PASSWORD: cmpd_pass
      POSTGRES_DB: cmpd_preventiva
    volumes:
      - cmpd_pgdata:/var/lib/postgresql/data
      - ./experiments/hospitais/cmpd_postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./experiments/hospitais/seeds/cmpd_postgres_bulk.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpd_user -d cmpd_preventiva"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shared-network

  ida-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ida_root_pass
    volumes:
      - ida_mysqldata:/var/lib/mysql
      - ./experiments/hospitais/ida_mysql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./experiments/hospitais/seeds/ida_mysql_bulk.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -pida_root_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shared-network

  reh-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: reh_user
      POSTGRES_PASSWORD: reh_pass
      POSTGRES_DB: reh_emergencias
    volumes:
      - reh_pgdata:/var/lib/postgresql/data
      - ./experiments/rede_federada/reh_postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reh_user -d reh_emergencias"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shared-network

  cdi-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cdi_user
      POSTGRES_PASSWORD: cdi_pass
      POSTGRES_DB: cdi_imagem
    volumes:
      - cdi_pgdata:/var/lib/postgresql/data
      - ./experiments/rede_federada/cdi_postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdi_user -d cdi_imagem"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shared-network

  rfa-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rfa_root_pass
    volumes:
      - rfa_mysqldata:/var/lib/mysql
      - ./experiments/rede_federada/rfa_mysql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -prfa_root_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shared-network

  dermexp_ham_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ham_user
      POSTGRES_PASSWORD: ham_pass
      POSTGRES_DB: ham10000
    volumes:
      - dermexp_ham_pgdata:/var/lib/postgresql/data
      - ./experiments/experiment3/raw/ham10000_metadata.csv:/data/ham10000_metadata.csv:ro
      - ./experiments/experiment3/source-db/ham/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ham_user -d ham10000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shared-network

  dermexp_hiba_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hiba_user
      POSTGRES_PASSWORD: hiba_pass
      POSTGRES_DB: hiba
    volumes:
      - dermexp_hiba_pgdata:/var/lib/postgresql/data
      - ./experiments/experiment3/raw/hiba_metadata.csv:/data/hiba_metadata.csv:ro
      - ./experiments/experiment3/source-db/hiba/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiba_user -d hiba"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shared-network

  dermexp_pad_mysql:
    build:
      context: ./experiments/experiment3
      dockerfile: source-db/pad/Dockerfile
    image: datafabric-pad-mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pad_root_pass
      MYSQL_DATABASE: isic
      MYSQL_USER: pad_user
      MYSQL_PASSWORD: pad_pass
    volumes:
      - dermexp_pad_mysqldata:/var/lib/mysql
      - ./experiments/experiment3/source-db/pad/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "3311:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --local-infile=1
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -ppad_root_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shared-network

  # Microserviço de Dataset Unificado
  # dataset-service:
  #   build: ./dataset-service
