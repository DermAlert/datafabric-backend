services:
  exp1sql-sus-pg:
    image: postgres:15
    container_name: exp1sql_sus_pg
    environment:
      POSTGRES_DB: db_sus_pg
      POSTGRES_USER: suspg_user
      POSTGRES_PASSWORD: suspg_pass
    volumes:
      - exp1sql_sus_pg_data:/var/lib/postgresql/data
      - ./db_sus_setup_10k.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suspg_user -d db_sus_pg"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shared-network

  exp1sql-sus-mysql:
    image: mysql:8.0
    container_name: exp1sql_sus_mysql
    environment:
      MYSQL_DATABASE: db_sus_mysql
      MYSQL_USER: susmy_user
      MYSQL_PASSWORD: susmy_pass
      MYSQL_ROOT_PASSWORD: susmy_root_pass
    volumes:
      - exp1sql_sus_mysql_data:/var/lib/mysql
      - ./db_sus_setup_mysql.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -psusmy_root_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - shared-network

  exp1sql-lab-pg:
    image: postgres:15
    container_name: exp1sql_lab_pg
    environment:
      POSTGRES_DB: db_laboratorio
